<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Caps</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#fff;
}

header{
    background:#000;
    color:white;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
}

.logo{
    color:gold;
    font-size:30px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

.hero{
    height:90vh;
    background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url("https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:60px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    margin-bottom:25px;
}

.shop-btn{
    background:gold;
    color:black;
    padding:15px 35px;
    text-decoration:none;
    font-weight:bold;
    border-radius:5px;
}

.featured{
    padding:80px 8%;
}

.featured h2{
    text-align:center;
    margin-bottom:40px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    border-radius:10px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.card h3{
    padding:15px;
    text-align:center;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>
<body>

<header>
<nav>
<div class="logo">ROYAL CAPS</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="cart.html">Cart</a></li>
</ul>
</nav>
</header>

<section class="hero">
<h1>Luxury Face Caps</h1>
<p>Premium Style. Premium Quality.</p>

<a href="shop.html" class="shop-btn">
Shop Collection
</a>
</section>

<section class="featured">
<h2>Featured Collection</h2>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=800&q=80">
<h3>Black Signature Cap</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=800&q=80">
<h3>Royal Navy Cap</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80">
<h3>Gold Edition Cap</h3>
</div>

</div>
</section>

<footer>
<p>© 2026 Royal Caps. All Rights Reserved.</p>
</footer>

</body>
</html>
