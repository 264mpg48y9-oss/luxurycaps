<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Caps | Cart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#000;
    padding:20px 8%;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:gold;
    font-size:32px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.cart-item{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.item-info h3{
    margin-bottom:5px;
}

.item-controls{
    display:flex;
    align-items:center;
    gap:10px;
}

.btn{
    padding:8px 12px;
    border:none;
    cursor:pointer;
    border-radius:5px;
    background:black;
    color:white;
}

.remove{
    background:red;
}

.summary{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.checkout{
    width:100%;
    padding:15px;
    background:gold;
    border:none;
    font-size:18px;
    font-weight:bold;
    margin-top:15px;
    cursor:pointer;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}
</style>
</head>
<body>

<header>
<nav>
<div class="logo">ROYAL CAPS</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="cart.html">Cart</a></li>
</ul>
</nav>
</header>

<div class="container">

<h1>Your Cart</h1>

<div id="cart-items"></div>

<div class="summary">
<h2>Total: $<span id="total">0</span></h2>

<button class="checkout" onclick="checkout()">
Proceed To Checkout
</button>
</div>

</div>

<footer>
<p>© 2026 Royal Caps. All Rights Reserved.</p>
</footer>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart(){

const cartItems = document.getElementById("cart-items");
const totalElement = document.getElementById("total");

cartItems.innerHTML = "";

let total = 0;

if(cart.length === 0){
cartItems.innerHTML =
"<h2 style='text-align:center'>Your cart is empty.</h2>";
totalElement.textContent = "0";
return;
}

cart.forEach((item,index)=>{

total += item.price * item.quantity;

cartItems.innerHTML += `
<div class="cart-item">

<div class="item-info">
<h3>${item.name}</h3>
<p>$${item.price}</p>
</div>

<div class="item-controls">

<button class="btn"
onclick="decrease(${index})">-</button>

<span>${item.quantity}</span>

<button class="btn"
onclick="increase(${index})">+</button>

<button class="btn remove"
onclick="removeItem(${index})">
Remove
</button>

</div>

</div>
`;
});

totalElement.textContent = total;
localStorage.setItem("cart", JSON.stringify(cart));
}

function increase(index){
cart[index].quantity++;
renderCart();
}

function decrease(index){
if(cart[index].quantity > 1){
cart[index].quantity--;
}
renderCart();
}

function removeItem(index){
cart.splice(index,1);
renderCart();
}

function checkout(){

if(cart.length === 0){
alert("Your cart is empty.");
return;
}

alert("Thank you for shopping with Royal Caps!");

cart = [];
localStorage.setItem("cart", JSON.stringify(cart));

renderCart();
}

renderCart();

</script>

</body>
</html>
