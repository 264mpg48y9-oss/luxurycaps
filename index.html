<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Caps - Luxury Face Caps</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f8f8f8;
}

header{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url('https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
    color:white;
}

<nav>
    <div class="logo">ROYAL CAPS</div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>
}

.logo{
    font-size:32px;
    font-weight:bold;
    letter-spacing:3px;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:30px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:500;
}

<a href="shop.html">
    <button>Shop Now</button>
</a>

.hero h1{
    font-size:65px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    margin-bottom:30px;
}

.hero button{
    background:gold;
    border:none;
    padding:15px 40px;
    font-size:18px;
    cursor:pointer;
    border-radius:5px;
}

.products{
    padding:80px 8%;
}

.products h2{
    text-align:center;
    font-size:40px;
    margin-bottom:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:350px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.card-content h3{
    margin-bottom:10px;
}

.price{
    color:#c9a227;
    font-size:24px;
    font-weight:bold;
}

.btn{
    margin-top:15px;
    padding:12px 25px;
    background:black;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:25px;
}
</style>
</head>
<body>

<header>

<nav>
<div class="logo">ROYAL CAPS</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Shop</a></li>
<li><a href="#">Collections</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<div class="hero">
<h1>Luxury Face Caps</h1>
<p>Premium Quality • Exclusive Designs • Worldwide Shipping</p>
<button>Shop Now</button>
</div>

</header>

<section class="products">

<h2>Featured Collection</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=800&q=80">
<div class="card-content">
<h3>Black Signature Cap</h3>
<p class="price">$120</p>
<button class="btn">Add to Cart</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80">
<div class="card-content">
<h3>Royal Gold Edition</h3>
<p class="price">$180</p>
<button class="btn">Add to Cart</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=800&q=80">
<div class="card-content">
<h3>Navy Elite Cap</h3>
<p class="price">$150</p>
<button class="btn">Add to Cart</button>
</div>
</div>

</div>

</section>

<footer>
<p>© 2026 Royal Caps. Luxury Headwear Brand.</p>
</footer>

<script>
const buttons = document.querySelectorAll(".btn");

buttons.forEach(btn=>{
btn.addEventListener("click",()=>{
alert("Item added to cart!");
});
});
</script>

</body>
</html>
